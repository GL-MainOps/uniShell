# uniShell shared shell configuration example.
#
# This file describes shell-neutral configuration.
# Shell adapters translate these settings into native shell syntax.
#
# Supported shells:
#   - bash
#   - zsh
#   - fish
#   - nushell
#
# Currently supported features:
#   - environment variables
#   - PATH entries
#   - aliases
#
# Intentionally not represented here yet:
#   - functions
#   - keybindings
#   - prompts
#
# Values are configuration data, not shell code.
# Shell-specific behavior belongs in the corresponding shell configuration.

# ---------------------------------------------------------------------------
# Environment variables
# ---------------------------------------------------------------------------

# [environment]
#
# Set environment variables in the generated shell configuration.
#
# EDITOR = "vim"
# PAGER = "less"
# FZF_DEFAULT_OPTS = "--height=40%"
#
# Values support uniShell interpolation using the `${NAME}` syntax.
# References can resolve from:
#   1. [environment] configuration values
#   2. the active uniShell session environment
#   3. the process/system environment
#
# Example:
#
# BASE_DIR = "${HOME}/.local"
# BIN_DIR = "${BASE_DIR}/bin"
#
# Interpolation also works in PATH entries and aliases.
#
# [path]
# add = [
#     "${BIN_DIR}",
# ]
#
# [aliases]
# work = "cd ${BASE_DIR}"
#
# Only `${NAME}` is interpreted by uniShell.
# Shell expansion and command substitution are not performed.
#
# `$HOME` remains literal.
# `$(whoami)` remains literal.

# ---------------------------------------------------------------------------
# PATH
# ---------------------------------------------------------------------------

# [path]
#
# Entries listed under `add` are added to PATH by the shell adapter.
#
# [path]
# add = [
#     "${HOME}/.local/bin",
#     "${HOME}/bin",
# ]

# Multiple entries are supported and retain their declared order.
#
# add = [
#     "${HOME}/.local/bin",
#     "${HOME}/bin",
#     "${UNISHELL_BIN}",
# ]

# ---------------------------------------------------------------------------
# Aliases
# ---------------------------------------------------------------------------

# [aliases]
#
# Define shell-neutral command aliases.
#
# ll = "ls -lah"
# la = "ls -A"
# gs = "git status"
# gd = "git diff"

# ---------------------------------------------------------------------------
# Complete example
# ---------------------------------------------------------------------------

# [environment]
# EDITOR = "vim"
# BASE_DIR = "${HOME}/.local"
# BIN_DIR = "${BASE_DIR}/bin"
#
# [path]
# add = [
#     "${BIN_DIR}",
# ]
#
# [aliases]
# ll = "ls -lah"
# la = "ls -A"
# gs = "git status"
# gd = "git diff"
