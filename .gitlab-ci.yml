stages:
  - validate
  - build
  - release

default:
  image: golang:1.25

workflow:
  rules:
    - if: '$CI_COMMIT_TAG'
    - when: never

validate:
  stage: validate
  script:
    - scripts/ci/validate.sh

build:
  stage: build

  cache:
    key: "unishell-acquisition-$CI_COMMIT_REF_SLUG"
    paths:
      - tmp/
    policy: pull-push

  variables:
    UNISHELL_PROFILE: "slim"
    UNISHELL_VERSION: "$CI_COMMIT_TAG"

  script:
    - ./scripts/build.sh --compress true --profile "$UNISHELL_PROFILE" --version "$UNISHELL_VERSION"

  artifacts:
    name: "unishell-release-binaries"
    paths:
      - bin/unishell-*
    expire_in: 2 days

  before_script:
    - test -n "$UNISHELL_AUTH_TOKEN"

release-preparation:
  stage: build

  needs:
    - job: build
      artifacts: true

  variables:
    GIT_DEPTH: "0"

  script:
    - scripts/release/checksums.sh SHA256SUMS
    - scripts/release/notes.sh "$CI_COMMIT_TAG" SHA256SUMS RELEASE_NOTES.md

  artifacts:
    name: "unishell-release-preparation"
    paths:
      - SHA256SUMS
      - RELEASE_NOTES.md
      - bin/unishell-*
    expire_in: 2 days

release:
  stage: release

  image: registry.gitlab.com/gitlab-org/cli:latest

  needs:
    - job: release-preparation
      artifacts: true

  script:
    - >
      GLAB_ENABLE_CI_AUTOLOGIN=true
      glab release create "$CI_COMMIT_TAG"
      --name "uniShell $CI_COMMIT_TAG"
      --notes-file RELEASE_NOTES.md
      --use-package-registry
      bin/unishell-*
      SHA256SUMS
