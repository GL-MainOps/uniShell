stages:
  - validate
  - build

default:
  image: golang:1.25

workflow:
  rules:
    - if: '$CI_COMMIT_TAG'
    - when: never

validate:
  stage: validate
  script:
    - scripts/ci/validate.sh

build:
  stage: build

  cache:
    key: "unishell-acquisition-$CI_COMMIT_REF_SLUG"
    paths:
      - tmp/
    policy: pull-push

  variables:
    UNISHELL_PROFILE: "full"
    UNISHELL_VERSION: "$CI_COMMIT_TAG"

  script:
    - ./scripts/build.sh --profile "$UNISHELL_PROFILE" --version "$UNISHELL_VERSION"

  artifacts:
    name: "unishell-release-binaries"
    paths:
      - bin/unishell-*
    expire_in: 2 days

  before_script:
    - test -n "$UNISHELL_AUTH_TOKEN"

release-preparation:
  stage: build

  needs:
    - job: build
      artifacts: true

  script:
    - scripts/release/checksums.sh SHA256SUMS
    - scripts/release/notes.sh "$CI_COMMIT_TAG" SHA256SUMS RELEASE_NOTES.md

  artifacts:
    name: "unishell-release-preparation"
    paths:
      - SHA256SUMS
      - RELEASE_NOTES.md
      - bin/unishell-*
    expire_in: 2 days
