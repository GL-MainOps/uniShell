name: CI

on:
  push:
    tags:
      - '*'

jobs:
  validate:
    runs-on: ubuntu-latest

    env:
      UNISHELL_AUTH_TOKEN: ${{ secrets.UNISHELL_AUTH_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25'

      - name: Validate
        run: scripts/ci/validate.sh

  build:
    needs: validate
    runs-on: ubuntu-latest

    env:
      UNISHELL_PROFILE: slim,full,k8s
      UNISHELL_VERSION: ${{ github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25'

      - name: Cache acquisition data
        uses: actions/cache@v5
        with:
          path: tmp/
          key: unishell-acquisition-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('assets/tools/*.toml') }}
          restore-keys: |
            unishell-acquisition-${{ runner.os }}-${{ runner.arch }}-

      - name: Verify authentication token
        env:
          UNISHELL_AUTH_TOKEN: ${{ secrets.UNISHELL_AUTH_TOKEN }}
        run: test -n "$UNISHELL_AUTH_TOKEN"

      - name: Build
        env:
          UNISHELL_AUTH_TOKEN: ${{ secrets.UNISHELL_AUTH_TOKEN }}
        run: ./scripts/build.sh --profile "$UNISHELL_PROFILE" --version "$UNISHELL_VERSION"

      - name: Upload build binaries
        uses: actions/upload-artifact@v7
        with:
          name: unishell-release-binaries
          path: bin/unishell-*
          if-no-files-found: error
          retention-days: 2

  release-preparation:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download build binaries
        uses: actions/download-artifact@v7
        with:
          name: unishell-release-binaries
          path: bin

      - name: Prepare release
        run: |
          scripts/release/checksums.sh SHA256SUMS
          scripts/release/notes.sh "$GITHUB_REF_NAME" SHA256SUMS RELEASE_NOTES.md

      - name: Upload release preparation
        uses: actions/upload-artifact@v7
        with:
          name: unishell-release-preparation
          path: |
            bin/unishell-*
            SHA256SUMS
            RELEASE_NOTES.md
          if-no-files-found: error
          retention-days: 2

  release:
    needs: release-preparation
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download release preparation
        uses: actions/download-artifact@v7
        with:
          name: unishell-release-preparation
          path: .

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "uniShell $GITHUB_REF_NAME" \
            --notes-file RELEASE_NOTES.md \
            bin/unishell-* \
            SHA256SUMS
