name: CI

on:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    env:
      UNISHELL_AUTH_TOKEN: ${{ secrets.UNISHELL_AUTH_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25'

      - name: Validate
        run: scripts/ci/validate.sh

  build:
    needs: validate
    runs-on: ubuntu-latest

    env:
      UNISHELL_PROFILE: full

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25'

      - name: Cache acquisition data
        uses: actions/cache@v5
        with:
          path: tmp/
          key: unishell-acquisition-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/*.toml') }}
          restore-keys: |
            unishell-acquisition-${{ runner.os }}-${{ runner.arch }}-

      - name: Verify authentication token
        env:
          UNISHELL_AUTH_TOKEN: ${{ secrets.UNISHELL_AUTH_TOKEN }}
        run: test -n "$UNISHELL_AUTH_TOKEN"

      - name: Build
        env:
          UNISHELL_AUTH_TOKEN: ${{ secrets.UNISHELL_AUTH_TOKEN }}
        run: ./scripts/build.sh --profile "$UNISHELL_PROFILE"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: unishell-${{ github.sha }}
          path: bin/unishell-full
          if-no-files-found: error
          retention-days: 7
