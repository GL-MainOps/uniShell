# ╔═══════════════════════════════════════════════════════════════
[environment]
# ╚═
# ╭────────────────────────────────╮
# │ UNISHELL                       │
# ╰────────────────────────────────╯
UNISHELL_CONFIG_PATH = "${UNISHELL_SESSION_RUNTIME_DIR}/config"
UNISHELL_CONFIG_SHELL_PATH = "${UNISHELL_CONFIG_PATH}/shell"

# ╭────────────────────────────────╮
# │ LOCALE                         │
# ╰────────────────────────────────╯
LANG = "en_US.UTF-8"
LANGUAGE = "en_US.UTF-8"
LC_ALL = "en_US.UTF-8"

# ╭────────────────────────────────╮
# │ DIFF | EDITOR | PAGER          │
# ╰────────────────────────────────╯
GROFF_NO_SGR = "1"
MANPAGER = 'sh -c "col -bx | bat -l man -p"'
PAGER = "bat -p --paging=always"
EDITOR = "vim"
# diffprog = ""

# ╭────────────────────────────────╮
# │ PROGRAM-SPECIFIC VARIABLES     │
# ╰────────────────────────────────╯
# ┌────────────────┐
# │ FZF            │
# └────────────────┘
FZF_DEFAULT_COMMAND = 'fd --hidden --exclude ".(git|cache)"'
FZF_DEFAULT_OPTS = '--ansi --info=default  --color  --multi  --margin=5%  --padding=2%  --height 80%  --prompt="❯❯❯ " --marker="✓ " --pointer="▶ " --header-first --layout=reverse  --border=rounded  --preview "[[ -d {} ]] && eza --group-directories-first -AMlF --no-permissions --no-user --no-time --total-size --tree --level=2 --color=always --icons=auto {} || bat --style=full --color=always --paging=never --line-range :500 {}" --bind "ctrl-/:toggle-preview"'

## CTRL_R
FZF_CTRL_R_OPTS = '--border-label "SHELL HISTORY" --preview "echo {}" --preview-window="down:25%:wrap" --layout=default'

## CTRL_T
FZF_CTRL_T_COMMAND = 'fd --type f --hidden --exclude ".git" --exclude ".cache"'
FZF_CTRL_T_OPTS = '--border-label "FIND FILES" --preview "bat --style=full --color=always --paging=never --line-range :500 {}" --preview-window="right:60%:wrap"'

## ALT_C
FZF_ALT_C_COMMAND = 'fd --type d --hidden --exclude ".git" --exclude ".cache"'
FZF_ALT_C_OPTS = '--border-label "FIND DIRECTORIES" --preview "eza --group-directories-first -AMlF --no-permissions --no-user --no-time --total-size --tree --level=2 --color=always --icons=auto {}" --preview-window="right:50%:wrap"'

## ZOXIDE
_ZO_FZF_OPTS = '--border-label "ZOXIDE RECENT DIRECTORIES" --ansi --info=default  --color  --margin=5%  --padding=2%  --height 80%  --prompt="❯❯❯ " --marker="✓ " --pointer="▶ " --header-first --layout=reverse  --border=rounded  --delimiter="\t" --preview "eza --group-directories-first -AMlF --no-permissions --no-user --no-time --total-size --tree --level=2 --color=always --icons=auto {2}" --preview-window="right:60%:wrap" --bind "ctrl-/:toggle-preview"'

# ┌────────────────┐
# │ GIT            │
# └────────────────┘
GIT_CONFIG_PARAMETERS="'core.pager'='delta' 'interactive.diffFilter'='delta --color-only' 'delta.navigate'='true' 'merge.conflictStyle'='zdiff3' 'core.sshCommand'='ssh -o StrictHostKeyChecking=no' 'color.ui'='auto' 'diff.mnemonicPrefix'='true' 'diff.renames'='true' 'diff.tool'='vimdiff' 'status.submoduleSummary'='true' 'status.showUntrackedFiles'='all' 'color.branch.upstream'='cyan' 'init.defaultBranch'='main' "

# ┌────────────────┐
# │ SUDO           │
# └────────────────┘
SUDO_INITIAL_PRESERVED_VARIABLES = "EDITOR,MANPAGER,PAGER,PATH,TMUX,SSH_AUTH_SOCK"

# ┌────────────────┐
# │ VIM            │
# └────────────────┘
# VIM_CACHE_HOME = "/tmp/.vim-private-tmp"

# ╚═══════════════════════════════════════════════════════════════



# ╔═══════════════════════════════════════════════════════════════
[aliases]
# ╚═
# ╭────────────────────────────────╮
# │ SYSTEM                         │
# ╰────────────────────────────────╯
ssh = "ssh -o StrictHostKeyChecking=no"
lports = "sudo lsof -i -P -n | grep LISTEN"

# ╭────────────────────────────────╮
# │ PROGRAM-SPECIFIC               │
# ╰────────────────────────────────╯
# ┌────────────────┐
# │ BAT            │
# └────────────────┘
less = "bat --paging=always"
cat = "bat -p"

# ┌────────────────┐
# │ EZA            │
# └────────────────┘
l = "eza --icons=auto --classify --group-directories-first"
ls = "eza --icons=auto --classify --group-directories-first"
la = "eza --icons=auto --classify --almost-all --group-directories-first"
lla = "eza --icons=auto --classify --almost-all --group-directories-first -l --group"
ll = "eza --icons=auto --classify --group-directories-first -l --group"
l1 = "eza --icons=auto --classify --almost-all --sort changed --time-style relative -l --no-user --no-permissions --total-size"

# ┌────────────────┐
# │ HAVN           │
# └────────────────┘
ports = "havn -a localhost"

# ┌────────────────┐
# │ NGINX          │
# └────────────────┘
ngxt = "sudo nginx -t"
ngxr = "sudo nginx -s reload"

# ┌────────────────┐
# │ ZOXIDE         │
# └────────────────┘
cd = "z"
zz = "zi"

# ╚═══════════════════════════════════════════════════════════════



# ╔═══════════════════════════════════════════════════════════════
[path]
# ╚═

add = [
    "${UNISHELL_SESSION_RUNTIME_DIR}/scripts/fzf",
    "${HOME}/.local/bin",
]

# ╚═══════════════════════════════════════════════════════════════
