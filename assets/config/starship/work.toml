# vim: set ft=toml:
# ╔═══════════════════════════════════════════════════════════════
# ║ PROMPT
# ╚═

add_newline = true

# ╭────────────────────────────────╮
# │ LEFT PROMPT                    │        ---    ╯ ╮ ╰ ╭ ─ │ 
# ╰────────────────────────────────╯
format = """
╭\\[ $username$os${custom.ipaddr} \\] $git_branch$git_commit $directory(fg:#C6D6CF) $fill${custom.timestamp}
│
╰[$shell$sudo](bold fg:#C6D6CF)$character
"""

# ╭────────────────────────────────╮
# │ RIGHT PROMPT                   │
# ╰────────────────────────────────╯
### right_format = """
### """

# ╚═══════════════════════════════════════════════════════════════



# ╔═══════════════════════════════════════════════════════════════
# ║ CUSTOM COMMANDS # VARS: style | symbol | output

# ╭────────────────────────────────╮
# │ IP ADDRESS                     │
# ╰────────────────────────────────╯
[custom.ipaddr]
    disabled = false
    command = '''
        ip -4 -o addr show | \
            awk '$4 ~ /^192\.168\./ {split($4,a,"/"); split(a[1],o,"."); print o[3]"."o[4]; exit}'
    '''
    when = true
    style = "bold underline italic fg:bright-yellow"
    require_repo = false
    symbol = ''
    format = '[$symbol($output)]($style)'
    shell = ['sh']

# ╭────────────────────────────────╮
# │ TIMESTAMP                      │
# ╰────────────────────────────────╯
[custom.timestamp]
    disabled = false
    command = 'date "+%R %p"'
    when = 'true'
    format = '[](fg:#49211f)[ ($output) $symbol]($style)[](fg:#49211f) '
    style = "bold fg:#f0b84b bg:bg:#49211f"
    require_repo = false
    symbol = '  '
    shell = ['sh']
[custom.long-timestamp]
    disabled = false
    command = 'date "+%X | %B-%d"'
    when = 'true'
    format = '[](fg:#343a47)[ $symbol ($output) $symbol ]($style)[](fg:#343a47)'
    style = "bold fg:#00d5a7 bg:bg:#343a47"
    require_repo = false
    symbol = '  '
    shell = ['sh']

# ╭────────────────────────────────╮
# │ TIMESTAMP                      │
# ╰────────────────────────────────╯
[custom.timezone]
    disabled = false
    command = '''
        tz="$(timedatectl show --property=Timezone --value)";
        city="${tz##*/}"
        echo "$city"
    '''
    when = 'true'
    format = '[$symbol( $output)]($style)'
    style = "bold yellow"
    require_repo = false
    symbol = ''
    shell = ['sh']

# ╭────────────────────────────────╮
# │ UNISHELL VERSION               │
# ╰────────────────────────────────╯
[custom.E_UNISHELL_SESSION_VERSION]
    disabled = false
    command = '''
        if [ -n "$UNISHELL_SESSION_VERSION" ]; then
            echo "$UNISHELL_SESSION_VERSION"
        fi
    '''
    when = 'true'
    format = '[$symbol($output )]($style)'
    style = "fg:black bg:#C6D6CF"
    require_repo = false
    symbol = '   '
    shell = ['sh']

# "$UNISHELL_CONFIG_SHELL_PATH/_functions/needreboot/needreboot.bash" >/dev/null 2>&1
# ╭────────────────────────────────╮
# │ NEED REBOOT                    │
# ╰────────────────────────────────╯
[custom.needReboot]
    disabled = false
    command = '''
        needreboot prompt >/dev/null 2>&1
        rc=$?

        case "$rc" in
            0)
                # REBOOT NEEDED
                # Bright bold amber (NON-BLNKING)
                    # printf '\033[1;38;2;255;191;0m\033[0m'

                # Bright bold amber (BLNKING)
                    # printf '\033[1;5;38;2;255;191;0m\033[0m'
                # Bright bold red (BLNKING)
                    printf '\033[1;5;38;2;255;0;0m\033[0m'
                ;;
            1)
                # NO REBOOT NEEDED
                # Bold mint green
                    printf '\033[1;38;2;152;255;152m\033[0m'
                ;;
            2)
                # OS UNKNOWN
                # Bold neutral light gray
                    printf '\033[1;38;2;209;213;219m󱈸\033[0m'
                ;;
        esac
    '''
    when = 'true'
    format = '[$symbol($output)  ]($style)'
    style = ''
    require_repo = false
    symbol = ''
    shell = ['bash']

# ╚═══════════════════════════════════════════════════════════════



# ╔═══════════════════════════════════════════════════════════════
# ║ SPECIFIC MODULES

# ╭────────────────────────────────╮
# │ DECORATIVE                     │
# ╰────────────────────────────────╯
# ┌────────────────┐
# │ LINE BREAK     │
# └────────────────┘
[line_break]
    disabled = false

# ┌────────────────┐
# │ FILL           │
# └────────────────┘
[fill]
    disabled = false
    symbol = '─'
    style = 'bold black'

# ┌────────────────┐
# │ CHARACTER      │
# └────────────────┘
[character] # VARS: symbol
    disabled = false
    format = '$symbol '
    success_symbol = '[](bold green)'
    error_symbol = '[](bold red)'



# ╭────────────────────────────────╮
# │ MACHINE INFO                   │
# ╰────────────────────────────────╯
# ┌────────────────┐
# │ OS             │
# └────────────────┘
[os] # VARS: style | symbol | name | type | codename | edition | version

    disabled = false
    format = ' [ $symbol ]($style) '
    style = 'bold fg:white bg:#4b1922'
    [os.symbols]
        Windows = " "
        Arch = "󰣇 "
        AlmaLinux = " "
        Alpine = " "
        Amazon = " "
        CentOS = " "
        Debian = " "
        EndeavourOS = " "
        Fedora = " "
        FreeBSD = " "
        Garuda = " "
        Linux = " "
        Macos = " "
        Manjaro = " "
        Mint = "󰣭 "
        NixOS = " "
        openSUSE = " "
        Pop = " "
        Redhat = " "
        RedHatEnterprise = " "
        RockyLinux = " "
        SUSE = " "
        Ubuntu = " "
        Unknown = " "

# ┌────────────────┐
# │ HOSTNAME       │
# └────────────────┘
[hostname] # VARS: style | ssh_symbol | hostname
    ssh_only = false
    ssh_symbol = ''
    # trim_at = '.'
    format = '[ 󰒍 $ssh_symbol$hostname ]($style)'
    style = 'bold fg:bright-yellow bg:#303030'
    disabled = false
    aliases = {
        "myahia" = "NTG-Laptop",
    }

# ┌────────────────┐
# │ USERNAME       │
# └────────────────┘
[username] # VARS: style | user
    disabled = false
    show_always= true
    style_root = 'blink bold fg:bright-red'
    style_user = 'bold fg:#63c77b'
    format = '[$user]($style)'
    aliases = { "root" = "  ROOT  ", "myahia" = "YAHIA", "yahia" = "YAHIA"}



# ╭────────────────────────────────╮
# │ SESSION & COMMANDS INFO        │
# ╰────────────────────────────────╯
# ┌────────────────┐
# │ SHELL          │
# └────────────────┘
[shell] # VARS: style | indicator
    disabled = false
    format = '[ $indicator  ]($style)'
    style = 'fg:#78a6ff'
    bash_indicator = ''
    fish_indicator = ''
    zsh_indicator = ''
    nu_indicator = ''
    powershell_indicator = '󰨊'
    pwsh_indicator = ''
    unknown_indicator = '>_?'

# ┌────────────────┐
# │ SUDO           │
# └────────────────┘
[sudo] # VARS: style | symbol
    disabled = false
    format = '[$symbol](bold fg:#ff5364)'
    symbol = '  '
    # style = 'bold red'
    allow_windows = false

# ┌────────────────┐
# │ EXIT STATUS    │
# └────────────────┘
[status] # VARS: style | symbol | status | hex_status | int | common_meaning | signal_number | signal_name | maybe_int | pipestatus
    disabled = false
    format = '[$symbol $status]($style) '
    style = "(bold red)"
    success_symbol = '[❯](bold green)'
    # success_style = "(bold green)"
    # failure_style = "(bold red)"
    map_symbol = true
    recognize_signal_code = true
    # symbol = '❌'
    # success_symbol = '[❯](bold green)'
    # success_symbol = ''
    # error_symbol =
    # not_executable_symbol = '🚫'
    # not_found_symbol = '🔍'
    # sigint_symbol = '🧱'
    # signal_symbol = '⚡'



# ╭────────────────────────────────╮
# │ DIRECTORY & GIT INFO           │gg
# ╰────────────────────────────────╯
# ┌────────────────┐
# │ DIRECTORIES    │
# └────────────────┘
[directory] # VARS: style | path
    disabled = false
    use_os_path_sep = true

    truncation_length = 0
    truncate_to_repo = true
    truncation_symbol = ' …/'
    home_symbol = " ~"
    read_only = ' '
    read_only_style = 'bold blink dimmed fg:#ff5364'

    before_repo_root_style = 'bold fg:#f0b84b' # The style for the path segment above the root of the git repo. The default value is equivalent to style.
    repo_root_style = 'bold fg:#dc7bd1' # The style for the root of the git repo. The default value is equivalent to style.
    repo_root_format = '[  ](bold fg:#f0b84b)[$before_root_path]($before_repo_root_style)[$repo_root]($repo_root_style)[$path]($style)[$read_only ]($read_only_style)'

    format = '[  ](bold fg:#f0b84b)[ $path ]($style)[$read_only]($read_only_style)'
    style = 'bold fg:white bg:#303030'

# ┌────────────────┐
# │ GIT BRANCH     │
# └────────────────┘
[git_branch] # VARS: style | symbol | branch | remote_name | remote_branch
    disabled = false
    always_show_remote = false
    # truncation_length = '2^63 - 1'
    truncation_symbol = '…'
    only_attached = true # Only show the branch name when not in a detached HEAD state.
    # ignore_branches = [] # A list of names to avoid displaying. Useful for 'master' or 'main'.
    ignore_bare_repo = false
    format = '[](fg:#343a47)[[$symbol](bold fg:#00d5a7 bg:#343a47)$branch(:$remote_branch)]($style)'
    symbol = '  '
    # symbol = ''
    style = 'bold bg:#343a47 fg:white'

# ┌────────────────┐
# │ GIT COMMIT     │
# └────────────────┘
[git_commit] # VARS: style | hash | tag
    disabled = false
    commit_hash_length = 5
    only_detached = false
    tag_disabled = false
    tag_max_candidates = 0
    tag_symbol = '  󰓹  '
    format = '[[   ](bold fg:#00d5a7 bg:#343a47)$hash$tag ]($style)[](fg:#343a47)'
    style = 'bold bg:#343a47 fg:white'

# ╚═══════════════════════════════════════════════════════════════

