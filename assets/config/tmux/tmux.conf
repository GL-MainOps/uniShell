# ╔═══════════════════════════════════════════════════════════════
# ║ GENERAL & BEHAVIOR SETTINGS

# ╭────────────────────────────────╮
# │ SPECIFY SHELL TO USE           │
# ╰────────────────────────────────╯
# NO NEED FOR IT IN UNISHELL NOW
# set-option -g default-command "exec env AUTH=$AUTH bash --rcfile $usHOME/.lesscache"


# ╭────────────────────────────────╮
# │ SCROLLBACK HISTORY LIMIT       │
# ╰────────────────────────────────╯
set -g history-limit 10000000


# ╭────────────────────────────────╮
# │ MOUSE MODE                     │
# ╰────────────────────────────────╯
set -g mouse on


# ╭────────────────────────────────╮
# │ ZERO ESCAPE TIME               │
# ╰────────────────────────────────╯
# Makes modal editors like Vim respond instantly when you press Escape
# Setting to 50 instead of 0, keeping Vim fast while leaving just enough buffer for terminal escape sequences to parse correctly.
set -sg escape-time 50


# ╭────────────────────────────────╮
# │ TIME ALLOWED FOR PREFIX ACTIONS│
# ╰────────────────────────────────╯
# Increasing the time allowed to pass actions after pressing the prefix key
set -g repeat-time 1000


# ╭────────────────────────────────╮
# │ Focus events                   │
# ╰────────────────────────────────╯
# Passes terminal focus events (Focus Gained / Focus Lost) from your outer terminal emulator through tmux to the applications running inside your panes
set -g focus-events on


# ╭────────────────────────────────╮
# │ START INDEXES AT 1             │
# ╰────────────────────────────────╯
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on


# ╭────────────────────────────────╮
# │ PROFILE-BASED CLIPBOARD SUPPORT│
# ╰────────────────────────────────╯
# Allow applications running inside tmux to pass special escape sequences directly through to your outer terminal emulator
set -g allow-passthrough on

# let tmux write your terminal clipboard.
%if #{==:#{UNISHELL_SESSION_SHELL_PROFILE},work}
    # Use rcopy as tmux's clipboard sink.
    set -s copy-command "$UNISHELL_SESSION_RUNTIME_DIR/scripts/rcopy/rcopy"

    # Let rcopy handle clip board transport rather than tmux itself.
    set -s set-clipboard off

%elif #{==:#{UNISHELL_SESSION_SHELL_PROFILE},personal}
    set -s set-clipboard on
    # Apply personal-specific settings
%endif

# ╚═══════════════════════════════════════════════════════════════



# ╔═══════════════════════════════════════════════════════════════
# ║ APPEARANCE

# ╭────────────────────────────────╮
# │ AGGRESSIVE WINDOW RESIZING     │
# ╰────────────────────────────────╯
# Optimizes how tmux resizes windows when multiple clients are attached to the same session
setw -g aggressive-resize on


# ╭────────────────────────────────╮
# │ 24-BIT COLOR SUPPORT           │
# ╰────────────────────────────────╯
set -g default-terminal "tmux-256color"

%if "#{>=:#{version},3.2}"
    set -as terminal-features ",*:RGB"
%else
    set -ag terminal-overrides ",*:Tc"
%endif


# ╭────────────────────────────────╮
# │ COPY MODE SELECTION STYLE      │
# ╰────────────────────────────────╯
setw -g copy-mode-selection-style "fg=#ffffff,bg=#3B4252,bold" # HIGH-CONTRAST - SUITABLE FOR TERMINAL TEXT COLORED WITH chromaterm


# ╭────────────────────────────────╮
# │ STATUS BAR                     │
# ╰────────────────────────────────╯
# Enable tmux status bar
set -g status on

# ┌────────────────┐
# │ MESSAGE        │
# │ DURATION       │
# └────────────────┘
set -g display-time 1000

# ┌────────────────┐
# │ UPDATE INTERVAL│
# └────────────────┘
set -g status-interval 3

# ┌────────────────┐
# │ POSITION       │
# └────────────────┘
set -g status-position bottom # top, bottom

# ┌────────────────┐
# │ WINDOW LIST    │
# │ ALIGNMENT      │
# └────────────────┘
set -g status-justify left # left, centre, right

# ┌────────────────┐
# │ MESSAGE/COMMAND│
# │ STYLING        │
# └────────────────┘
set -g message-style "fg=#1f232a,bg=#e0af68,fill=#e0af68,bold"
set -g message-command-style "fg=#1f232a,bg=#87d7ff,fill=#87d7ff,bold"

# ┌────────────────┐
# │ AUTO EMPTY     │
# │ WINDOW NAMES   │
# └────────────────┘
set -g automatic-rename-format ""

# ┌────────────────┐
# │ STATUS BAR     │
# │ COLORS         │
# └────────────────┘
#set -g status-style fg=white,bold,bg=colour8
set -g status-style "fg=#e5e9f0,bold,bg=#1f232a"

# ┌────────────────┐
# │ RIGHT-SIDE     │
# │ COMPONENTS     │
# └────────────────┘
### Style
set -g status-right-length 200

# Monitoring Metrics (sysmon)
set -g status-right '#[bold,fg=#3B4252,bg=#1f232a]#[fg=#a6e3a1,bold,bg=#3B4252] #(if command -v sysmon > /dev/null 2>&1; then sysmon; else uptime -p; fi) #[bold,fg=#1f232a,bg=#3B4252]#[bold,italics,fg=#A6E3A1,bg=#1f232a]    %R %p '

# ┌────────────────┐
# │ LEFT-SIDE      │
# │ COMPONENTS     │
# └────────────────┘
### Style
set -g status-left-length 15 # Session name.Window index.Pane index (us-abc.1.2)
set -g status-left '#[bold,fg=#a6e3a1,bg=#3B4252] [#S] #[bold,fg=#3B4252,bg=#1f232a] '

### WINDOW-LIST
###### WINDOWS SEPARATOR
set -g window-status-separator "" # REMOVED IN ORDER TO RENDER [ ] CORRECTLY

###### ACTIVE WINDOW
setw -g window-status-current-style "NONE"
setw -g window-status-current-format "#[bold,italics,fg=#{?window_zoomed_flag,#a6e3a1,#e0af68},bg=#1f232a] #[bold,italics,fg=#1f232a,bg=#{?window_zoomed_flag,#a6e3a1,#e0af68}] #{?window_zoomed_flag,  ,  }#I #{?automatic-rename,,#W } #[bold,italics,fg=#{?window_zoomed_flag,#a6e3a1,#e0af68},bg=#1f232a]"

###### INACTIVE WINDOWS
setw -g window-status-style "NONE"
setw -g window-status-format "#{?window_zoomed_flag,#[fg=#ff5364]#[bg=#1f232a] #[fg=#000000]#[bg=#ff5364],#[fg=#87d7ff]#[bg=#1f232a] }#[bold]#[italics]#{?#{==:#{automatic-rename},on},, #I #W#{?#{==:#{window_name},},, }}#[nobold]#[noitalics]#{?window_zoomed_flag,#[fg=#ff5364]#[bg=#1f232a],#[fg=#87d7ff]#[bg=#1f232a]}"



# ╭────────────────────────────────╮
# │ WINDOWS & PANES                │
# ╰────────────────────────────────╯
# ┌────────────────┐
# │ MONITOR WINDOW │
# │ ACTIVITY       │
# └────────────────┘
setw -g monitor-activity on
set -g visual-activity off

# ┌────────────────┐
# │ FOCUSED PANE   │
# └────────────────┘
# Sets the active pane's colors back to your outer terminal's default colors
set -g window-active-style fg=terminal,bg=terminal
# Inactive pane Colors
setw -g window-style fg=#808080,bg=#181818

# ┌────────────────┐
# │ PANE BORDER    │
# │ STYLE          │
# └────────────────┘
set -g pane-border-lines heavy # double, heavy, simple (ASCII), number

# ┌────────────────┐
# │ PANE TITLES    │
# │ ON BORDERS     │
# └────────────────┘
set -g pane-border-status top
set -g pane-border-format " #[bold,italics,fg=#87d7ff]#{pane_index}: #[bold,italics,fg=#e0af68]#{pane_current_command} "

# ┌────────────────┐
# │ PANE BORDER    │
# │ COLORS         │
# └────────────────┘
setw -g pane-border-style "fg=#1b444b,bg=default"
setw -g pane-active-border-style "fg=#a6e3a1,bg=default"

# ╚═══════════════════════════════════════════════════════════════



# ╔═══════════════════════════════════════════════════════════════
# ║ KEY BINDINGS

# ╭────────────────────────────────╮
# │ SET PREFIX KEY TO backtick (`) │
# ╰────────────────────────────────╯
unbind C-b
set -g prefix `
bind ` send-prefix


# ╭────────────────────────────────╮
# │ COMMAND MODE ON ; as well as : │
# ╰────────────────────────────────╯
bind ';' command-prompt


# ╭────────────────────────────────╮
# │ PANE-RELATED KEYBINDINGS       │
# ╰────────────────────────────────╯
# ┌────────────────┐
# │ ZOOM           │
# └────────────────┘
unbind z
bind f resize-pane -Z

# ┌────────────────┐
# │ SYNC           │
# └────────────────┘
bind S setw synchronize-panes \; display "synchronize-panes #{?pane_synchronized,on,off}"

# ┌────────────────┐
# │ RESIZING       │
# └────────────────┘
bind -n C-M-Left  resize-pane -L 5
bind -n C-M-Down  resize-pane -D 5
bind -n C-M-Up    resize-pane -U 5
bind -n C-M-Right resize-pane -R 5

# ┌────────────────┐
# │ SWAPPING       │
# └────────────────┘
bind -r > swap-pane -D
bind -r < swap-pane -U


# ┌────────────────┐
# │ - BREAK OUT    │
# │ - MARK         │
# │ - JOIN         │
# └────────────────┘
bind b break-pane -d
bind m select-pane -m
bind @ join-pane -h

# ┌────────────────┐
# │ SPLITTING PANES│
# │ IN SAME $CWD   │
# └────────────────┘
bind 's' split-window -v -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

bind 'v' split-window -h -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"

# unbind '"'
# unbind %



# ╭────────────────────────────────╮
# │ WINDOW-RELATED KEYBINDINGS     │
# ╰────────────────────────────────╯
# ┌────────────────┐
# │ POP-UP WINDOW  │
# └────────────────┘
bind-key Escape display-popup -E -w 80% -h 80% -S 'fg=#e0af68' -d "#{pane_current_path}"

# ╭────────────────────────────────╮
# │ VI MODE                        │
# ╰────────────────────────────────╯
setw -g mode-keys vi
set -g status-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel
# bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-no-clear


# ╚═══════════════════════════════════════════════════════════════
