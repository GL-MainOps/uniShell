[[tools]]
name = "startship"
profiles = [
    "full",
    "slim",
    "common"
]

[[tools.artifacts]]
version = "1.26.0"
platform = "linux"
architecture = "amd64"
archive_type = "tar.gz"
binary_path = "starship"
binary_name = "starship"
checksum = ""

[tools.artifacts.validation]
static_elf = true
musl = true
executable = true

[tools.artifacts.source]
kind = "github-release"

[tools.artifacts.source.github_release]
owner = "starship"
repository = "starship"
release = "v1.26.0"
asset = "starship-x86_64-unknown-linux-musl.tar.gz"
