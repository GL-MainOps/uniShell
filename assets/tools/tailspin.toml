[tools.artifacts.validation]
static_elf = true
musl = true
executable = true

[tools.artifacts.source]
kind = "github-release"

[tools.artifacts.source.github_release]
owner = "bensadeh"
repository = "tailspin"
release = "7.0.0"
asset = "tailspin-x86_64-unknown-linux-musl.tar.gz"
