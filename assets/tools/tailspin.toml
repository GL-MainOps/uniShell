[[tools]]
name = "tailspin"
profiles = [
    "full",
    "slim",
    "common"
]

[[tools.artifacts]]
version = "7.0.0"
platform = "linux"
architecture = "amd64"
archive_type = "tar.gz"
binary_path = "tspin"
